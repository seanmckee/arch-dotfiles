background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    font_size = 80
    position = 0, 120
    halign = center
    valign = center
  }

# date
label {
    monitor = 
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 20
    position = 0, 45
    halign = center
    valign = center
  }

input-field {
    monitor =
    size = 300, 50
    position = 0, -70
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 12

    dots_center = true
    fade_on_empty = true

    placeholder_text = <i>Enter Your Fucking Password</i>

    outer_color = rgb(7aa2f7)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgb(c0caf5)

    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
}

# BATTERY PERCENTAGE
label {
    monitor =
    text = cmd[update:5000] echo "Battery: $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = bottom
}
animations {
    enabled = true

    bezier = smoothOut, 0.22, 1, 0.36, 1
    bezier = pop, 0.34, 1.56, 0.64, 1

    animation = fadeOut, 1, 4, smoothOut
    animation = inputFieldColors, 1, 3, smoothOut
    animation = inputFieldDots, 1, 3, pop
}
