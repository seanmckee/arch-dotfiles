# Kanagawa -- GENERATED by `theme`; edit themes/templates/fuzzel.ini instead
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -e
layer=overlay
lines=12
width=45
horizontal-pad=20
vertical-pad=16
inner-pad=8

[colors]
background=1f1f28f2
text=dcd7baff
prompt=7e9cd8ff
placeholder=727169ff
input=dcd7baff
match=ffa066ff
selection=363646ff
selection-text=dcd7baff
selection-match=ffa066ff
counter=727169ff
border=7e9cd8ff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
# vim-style navigation, consistent with hyprland H/J/K/L
cursor-left=Control+h
prev=Up Control+p Control+k
next=Down Control+n Control+j
