# Tokyo Night Storm -- matches kitty / waybar / nvim
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#7aa2f7)\
[ $directory](bg:#7aa2f7 fg:#1d202f)\
[](fg:#7aa2f7 bg:#414868)\
$git_branch$git_status\
[](fg:#414868)\
$python$nodejs$rust$golang\
$cmd_duration
$character"""

add_newline = true

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bg:#7aa2f7 fg:#1d202f bold"
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "bg:#7aa2f7 fg:#f7768e"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"dotfiles" = " "

[git_branch]
symbol = " "
format = "[ $symbol$branch]($style)"
style = "bg:#414868 fg:#9ece6a"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:#414868 fg:#e0af68"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #7aa2f7)"

[cmd_duration]
min_time = 2000
format = " [ $duration]($style)"
style = "fg:#565f89"

[python]
symbol = " "
format = ' [$symbol$version]($style)'
style = "fg:#e0af68"

[nodejs]
symbol = " "
format = ' [$symbol$version]($style)'
style = "fg:#9ece6a"

[rust]
symbol = " "
format = ' [$symbol$version]($style)'
style = "fg:#ff9e64"

[golang]
symbol = " "
format = ' [$symbol$version]($style)'
style = "fg:#7dcfff"
