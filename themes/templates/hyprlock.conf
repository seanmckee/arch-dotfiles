#  GENERATED by `theme` from themes/templates/hyprlock.conf — do not edit.
#  Edit the template and re-run `theme set <name>`.

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# The active theme's wallpaper, blurred. Swap `path` to `screenshot` to blur
# whatever is on screen at lock time instead.
background {
    monitor =
    path = @@wallpaper_path@@

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.92
    brightness = 0.45
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# ── time ──────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgb(@@fg_hex@@)
    font_size = 112
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(@@bg_dark_hex@@cc)
    shadow_boost = 1.2
}

# ── date ──────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgb(@@dim_hex@@)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 96
    halign = center
    valign = center
}

# ── password ──────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 56
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 14

    dots_size = 0.26
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <i>Enter Your Fucking Password</i>

    outer_color = rgb(@@accent2_hex@@)
    inner_color = rgba(@@bg_dark_hex@@d9)
    font_color  = rgb(@@fg_hex@@)

    check_color    = rgb(@@green_hex@@)
    fail_color     = rgb(@@red_hex@@)
    fail_text      = <i>$FAIL  <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    capslock_color = rgb(@@yellow_hex@@)
    numlock_color  = -1
    bothlock_color = rgb(@@accent_hex@@)
    invert_numlock = false
}

# ── greeting ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ "$h" -lt 12 ]; then g=morning; elif [ "$h" -lt 18 ]; then g=afternoon; else g=evening; fi; echo "Good $g, $(whoami)"
    color = rgb(@@muted_hex@@)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -68
    halign = center
    valign = center
}

# ── battery (bottom left) ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo 0); s=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$s" = Charging ]; then i="󰂄"; elif [ "$c" -ge 80 ]; then i="󰁹"; elif [ "$c" -ge 50 ]; then i="󰁿"; elif [ "$c" -ge 20 ]; then i="󰁻"; else i="󰁺"; fi; echo "$i  ${c}%"
    color = rgb(@@dim_hex@@)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 48, 40
    halign = left
    valign = bottom
}

# ── network (bottom right) ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] n=$(nmcli -t -f NAME connection show --active 2>/dev/null | head -1); if [ -n "$n" ]; then echo "󰖩  $n"; else echo "󰖪  offline"; fi
    color = rgb(@@dim_hex@@)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -48, 40
    halign = right
    valign = bottom
}

# ── lock hint (bottom center) ─────────────────────────────────────────────
label {
    monitor =
    text = 󰌾  locked
    color = rgb(@@muted_hex@@)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 42
    halign = center
    valign = bottom
}

animations {
    enabled = true

    bezier = smoothOut, 0.22, 1, 0.36, 1
    bezier = pop, 0.34, 1.56, 0.64, 1

    animation = fadeOut, 1, 4, smoothOut
    animation = inputFieldColors, 1, 3, smoothOut
    animation = inputFieldDots, 1, 3, pop
}
