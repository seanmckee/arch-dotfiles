# @@name@@ -- GENERATED by `theme`
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse off
set -g mode-keys vi
set -g status-keys vi
set -g history-limit 100000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

set -g status-position top
set -g status-style 'bg=@@bg_dark@@,fg=@@dim@@'
set -g status-left ' #[fg=@@cyan@@,bold]#S #[fg=@@muted@@]│ '
set -g status-right '#[fg=@@muted@@]│ #[fg=@@dim@@]%H:%M '
setw -g window-status-format ' #[fg=@@muted@@]#I:#W '
setw -g window-status-current-format ' #[fg=@@accent@@,bold]#I:#W '
set -g pane-border-style 'fg=#@@border_inactive@@'
set -g pane-active-border-style 'fg=@@blue@@'
set -g message-style 'bg=@@bg@@,fg=@@fg@@'
