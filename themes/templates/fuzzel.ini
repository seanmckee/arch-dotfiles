# @@name@@ -- GENERATED by `theme`; edit themes/templates/fuzzel.ini instead
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -e
layer=overlay
lines=12
width=45
horizontal-pad=20
vertical-pad=16
inner-pad=8

[colors]
background=@@bg_hex@@@@bg_alpha@@
text=@@fg_hex@@ff
prompt=@@accent2_hex@@ff
placeholder=@@muted_hex@@ff
input=@@fg_hex@@ff
match=@@accent_hex@@ff
selection=@@sel_hex@@ff
selection-text=@@fg_hex@@ff
selection-match=@@accent_hex@@ff
counter=@@muted_hex@@ff
border=@@accent2_hex@@ff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
# vim-style navigation, consistent with hyprland H/J/K/L
cursor-left=Control+h
prev=Up Control+p Control+k
next=Down Control+n Control+j
