# @@name@@ -- GENERATED by `theme`
gui:
  theme:
    activeBorderColor:
      - "@@accent@@"
      - bold
    inactiveBorderColor:
      - "@@muted@@"
    searchingActiveBorderColor:
      - "@@cyan@@"
      - bold
    optionsTextColor:
      - "@@blue@@"
    selectedLineBgColor:
      - "@@sel@@"
    cherryPickedCommitBgColor:
      - "@@sel@@"
    cherryPickedCommitFgColor:
      - "@@magenta@@"
    unstagedChangesColor:
      - "@@red@@"
    defaultFgColor:
      - "@@fg@@"
  authorColors:
    "*": "@@magenta@@"
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  scrollHeight: 4
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
